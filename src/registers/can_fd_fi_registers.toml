[CORE_INFO]
mode = "r"
description = "Magic number of the IP Core"
info_t.type = "bit_vector"
info_t.width = 32
info_t.default_value = 0x4A_4E_49_43
info_t.description = "Magic number of the IP Core (CINJ)"

[CORE_VERSION]
mode = "r"
description = "Version of the IP Core (major.minor.patch + magic valid byte)"

# Fields are declared LSB-first: the first field lands at bit 0.
# Layout: [31:24] major | [23:16] minor | [15:8] patch | [7:0] magic_valid
magic_valid.type = "bit_vector"
magic_valid.width = 8
magic_valid.default_value = 0xAA
magic_valid.description = "Magic byte, must read 0xAA to indicate a valid version register"

patch.type = "bit_vector"
patch.width = 8
patch.default_value = 0x05
patch.description = "Patch version (uint8)"

minor.type = "bit_vector"
minor.width = 8
minor.default_value = 0x02
minor.description = "Minor version (uint8)"

major.type = "bit_vector"
major.width = 8
major.default_value = 0x01
major.description = "Major version (uint8)"

[STATUS_FLAGS]
mode = "r"
tu_ready_config.type = "bit"
tu_ready_config.description = "TU Configuration has been applied"
tu_ready_config.default_value = "1"

inj_err_miss.type = "bit"
inj_err_miss.description = "OU Injection Error: Bit was not encountered"
inj_err_miss.default_value = "0"

inj_err_dom.type = "bit"
inj_err_dom.description = "OU injection Error: Bit was dominant"
inj_err_dom.default_value = "0"

inj_err_dlc.type = "bit"
inj_err_dlc.description = "OU Injection Error: DLC did not match Frame DLC"
inj_err_dlc.default_value = "0"

inj_err_fsm.type = "bit"
inj_err_fsm.description = "OU Injection Error: FSM encountered an error frame"
inj_err_fsm.default_value = "0"

[GLOBAL_CONFIG]
mode = "r_w"
description = "Global Configuration Register"

cfg_en.type = "bit"
cfg_en.description = "Configuration Enable: Sets the core to Configuration mode"
cfg_en.default_value = "0"

cfg_brp_nomi.type = "integer"
cfg_brp_nomi.description = "BRP for Nominal Configuration"
cfg_brp_nomi.default_value = 8
cfg_brp_nomi.min_value = 1
cfg_brp_nomi.max_value = 32

cfg_brp_data.type = "integer"
cfg_brp_data.description = "BRP for Data Configuration"
cfg_brp_data.default_value = 8
cfg_brp_data.min_value = 1
cfg_brp_data.max_value = 32

cfg_td_en.type = "bit"
cfg_td_en.description = "Configures if TD should be measured during Transceiver-mode"
cfg_td_en.default_value = "0"

cfg_ssp.type = "integer"
cfg_ssp.description = "Secondary Sample Point Delta"
cfg_ssp.min_value = 0
cfg_ssp.max_value = 383

[NOMINAL_CONFIG]
mode = "r_w"
description = "Nominal Bit Time Configuration (Prop Seg removed per specifications)"

cfg_ph1_len_nomi.type = "integer"
cfg_ph1_len_nomi.description = "Nominal Phase 1 Length"
cfg_ph1_len_nomi.min_value = 1
cfg_ph1_len_nomi.max_value = 255

cfg_ph2_len_nomi.type = "integer"
cfg_ph2_len_nomi.description = "Nominal Phase 2 Length"
cfg_ph2_len_nomi.min_value = 1
cfg_ph2_len_nomi.max_value = 127

cfg_sjw_nomi.type = "integer"
cfg_sjw_nomi.description = "Nominal SJW"
cfg_sjw_nomi.min_value = 1
cfg_sjw_nomi.max_value = 127

[DATA_CONFIG]
mode = "r_w"
description = "Data Bit Time Configuration"

cfg_ph1_len_data.type = "integer"
cfg_ph1_len_data.description = "Data Phase 1 Length"
cfg_ph1_len_data.min_value = 1
cfg_ph1_len_data.max_value = 255

cfg_ph2_len_data.type = "integer"
cfg_ph2_len_data.description = "Data Phase 2 Length"
cfg_ph2_len_data.min_value = 1
cfg_ph2_len_data.max_value = 127

cfg_sjw_data.type = "integer"
cfg_sjw_data.description = "Data SJW"
cfg_sjw_data.min_value = 1
cfg_sjw_data.max_value = 127

[FI_CONFIG]
mode = "r_w"
description = "Fault Injection specific settings"

cfg_psp_nomi.type = "integer"
cfg_psp_nomi.description = "Pre-Sample Point position for nominal rate"
cfg_psp_nomi.min_value = 0
cfg_psp_nomi.max_value = 255

cfg_psp_data.type = "integer"
cfg_psp_data.description = "Pre-Sample Point position for data rate"
cfg_psp_data.min_value = 0
cfg_psp_data.max_value = 255

cfg_fip_nomi.type = "integer"
cfg_fip_nomi.description = "Fault Injection Point position for nominal rate"
cfg_fip_nomi.min_value = 0
cfg_fip_nomi.max_value = 255

cfg_fip_data.type = "integer"
cfg_fip_data.description = "Fault Injection Point position for data rate"
cfg_fip_data.min_value = 0
