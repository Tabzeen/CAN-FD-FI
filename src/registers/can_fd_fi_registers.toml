# ==========================================
# RAM Address and Data
# ==========================================

[MU_CFG_BASE]
mode = "w"
description = "Register for Memory Unit Configuration"

ram_data_valid.type = "bit"
ram_data_valid.description = "Tells the slave, that the RAM Data on the bus is valid"
ram_data_valid.default_value = "0"

[MU_CFG_ADDR]
mode = "w"
description = "Address offset in RAM in which the RAM Segment is written"

ram_data_address.type = "bit_vector"
ram_data_address.width = 15
ram_data_address.description = "Target segment address in the ID memory, where the 32 bit payload should be placed. Address = entry_index * 32 + segment_index, with segment_index in 0..17 covering the 576 bit Data + CRC field. The stride is 32 (a power of two) so entry and segment are plain bit-slices of the address; segment_index values 18..31 do not exist and are rejected. Addresses at or beyond ID_MEM_ENTRY_COUNT * 32 are also rejected. Any rejected write raises the RAM write error flag."
ram_data_address.default_value = 0x0001

[MU_RAM_DATA]
mode = "w"
description = "RAM data to write into the ID memory"
ram_data_payload.type = "bit_vector"
ram_data_payload.width = 32
ram_data_payload.description = "One 32 bit segment of the 576 bit Data + CRC field, placed at the segment selected by MU_CFG_BASE.ram_data_address"
ram_data_payload.default_value = 0x0000_0000
